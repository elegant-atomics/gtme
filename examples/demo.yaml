# The zero-key demo: `gtme run examples/demo.yaml --simulate` executes this
# entire pipeline offline — the Apollo source is served from its conformance
# fixtures, the AI steps answer synthetically (marked as such), and delivery
# is held with its variables resolved into the receipt. No API keys, no
# network, no spend, nothing persisted.
#
# With real keys set (gtme secret set APOLLO_API_KEY / ANTHROPIC_API_KEY /
# ATTIO_API_KEY), the same file climbs the rest of the ladder:
#   gtme plan examples/demo.yaml          # contracts + cost, still $0
#   gtme run  examples/demo.yaml --dry-run  # everything but delivery
#   gtme run  examples/demo.yaml          # armed
name: demo
version: 1

source:
  use: apollo/search        # a vendor adapter that is pure YAML — see spec/bindings/
  with:
    query: vp marketing, saas
    limit: 25

steps:
  - id: fit
    use: ai/filter
    uses: [first_name, title, company_name]   # masked fields only — free (ADR-043)
    with:
      prompt: >
        Keep only people who plausibly own outbound tooling decisions.

  - id: reveal              # ADR-043: pay Apollo's per-credit reveal only past the filter
    use: apollo/enrich
    when: fit.passed
    cache: 30d

  - id: lines
    use: ai/compose
    when: fit.passed
    uses: [full_name, title, company_name]
    with:
      prompt: >
        Write first_line and ps_line for a short, honest intro email.

  - id: send                # a deliver adapter is an ordinary step (ADR-031)
    use: attio/assert       # also pure YAML; assert = idempotent upsert
    variables:
      name: full_name
      first_line: first_line
    idempotency: email

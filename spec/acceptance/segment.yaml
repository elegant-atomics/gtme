story: segment
invariant: >
  A slice of accumulated knowledge is a SQL statement away, and the same slice
  can seed a new pipeline.
given: >
  A ledger with records from one or more prior runs.
when: >
  The operator runs `gtm query --save NAME "SELECT ..."` with a single
  SELECT/WITH/EXPLAIN statement.
then: >
  The statement is stored and re-executable by name, it runs against a
  read-only connection (`mode=ro`) so it cannot mutate the ledger, and its
  result set can be used to scope which identities a subsequent pipeline or
  `gtm show` inspects.
spec_refs: ["§8 gtm query", "§11 M4"]

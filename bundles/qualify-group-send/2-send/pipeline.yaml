name: send
version: 1
source:
  id: source
  use: ""
  group: qualified
steps:
  - id: lines
    use: ai/compose
    with:
      prompt: |
        Write first_line and ps_line for a short, honest intro email. first_line names something specific about their role; ps_line is one low-pressure sentence. No flattery, no exclamation marks.
    uses:
      - full_name
      - title
      - company_name
  - id: send
    use: instantly/add-to-campaign
    with:
      campaign: 11111111-1111-4111-8111-111111111111
    idempotency: email
    variables:
      first_name: full_name
      personalization: first_line
      ps_line: ps_line
group: sent
